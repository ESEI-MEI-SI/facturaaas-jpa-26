# Application
spring.application.name=facturaaas-backend

# Desarrollo (perfil por defecto)

# Server Configuration
server.port=8080

# BD en memoria H2 para desarrollo
spring.datasource.url=jdbc:h2:mem:facturaaas
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driverClassName=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


#---
spring.config.activate.on-profile=prod
spring.h2.console.enabled=false

# DB de Producción (perfil habilitado con -Dspring.profiles.active=prod)
spring.datasource.url=jdbc:mysql://localhost:3306/facturaaas
spring.datasource.username=facturaaas
spring.datasource.password=facturaaas
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
